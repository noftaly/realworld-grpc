name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx turbo run build check-types

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: biomejs/setup-biome@v2
      - run: biome ci .

      - run: npx buf lint
        working-directory: packages/proto

      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: |
          go install github.com/googleapis/api-linter/v2/cmd/api-linter@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npm run lint:aip --workspace=@repo/proto
